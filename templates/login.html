{% extends "base.html" %}
{% block titulo %}Entrar — InfoCaps{% endblock %}
{% block corpo %}
<main class="fundo-auth"><div class="auth">
  <span class="selo grande">IC</span>
  <h1>Acesse sua conta</h1><p class="sub">Entre para visualizar sua agenda e suas informações.</p>
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
    <label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="Digite seu e-mail">
    <label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password" placeholder="Digite sua senha">
    <button class="btn cheio">Entrar</button>
  </form>
  <p class="centro">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se no InfoCaps</a></p>
</div></main>
{% endblock %}
